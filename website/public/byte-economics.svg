<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Device-side image byte economics</title>
  <desc id="desc">A two-panel diagram showing the source-to-output byte delta and two distinct storage cases: a gallery source that remains and app-owned staging that may be replaced only when policy permits deletion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151d"/>
      <stop offset="1" stop-color="#0b1f2b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
      .panel-title { font-size: 36px; font-weight: 800; fill: #f8fafc; }
      .box-title { font-size: 25px; font-weight: 800; fill: #f8fafc; }
      .box-note { font-size: 18px; fill: #cbd5e1; }
      .formula { font-size: 25px; font-weight: 750; }
      .scenario { font-size: 22px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="32" fill="url(#background)"/>
  <text x="70" y="76" fill="#f8fafc" font-size="46" font-weight="850">Control image bytes before they become product cost</text>
  <text x="70" y="122" fill="#94a3b8" font-size="23">One device-side boundary affects bytes in motion and app-owned bytes at rest.</text>

  <rect x="60" y="170" width="720" height="500" rx="26" fill="url(#blue)" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="2"/>
  <text x="100" y="222" class="label" fill="#60a5fa">01 · UPLOAD ECONOMICS</text>
  <text x="100" y="268" class="panel-title">Bytes that move</text>

  <rect x="100" y="320" width="170" height="112" rx="18" fill="#0f172a" stroke="#64748b"/>
  <text x="125" y="363" class="box-title">4 MB</text>
  <text x="125" y="396" class="box-note">local source</text>
  <line x1="285" y1="376" x2="330" y2="376" stroke="#94a3b8" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="345" y="320" width="210" height="112" rx="18" fill="#2563eb" stroke="#60a5fa"/>
  <text x="370" y="363" class="box-title">500 KB</text>
  <text x="370" y="396" class="box-note">accepted output</text>
  <line x1="570" y1="376" x2="615" y2="376" stroke="#94a3b8" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="630" y="320" width="110" height="112" rx="18" fill="#f8fafc"/>
  <text x="653" y="377" fill="#0f172a" font-size="24" font-weight="800">upload</text>

  <text x="100" y="505" class="formula" fill="#93c5fd">source-to-output byte delta</text>
  <text x="100" y="540" class="formula" fill="#93c5fd">= input − accepted output</text>
  <text x="100" y="580" class="scenario">Illustrative: 1M accepted images · 4 MB → 500 KB</text>
  <text x="100" y="618" fill="#f8fafc" font-size="29" font-weight="850">3.5 TB source-to-output delta</text>
  <text x="100" y="646" fill="#cbd5e1" font-size="16">Incremental transfer savings require a matched current-pipeline baseline.</text>

  <rect x="820" y="170" width="720" height="500" rx="26" fill="url(#teal)" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>
  <text x="860" y="222" class="label" fill="#5eead4">02 · DEVICE STORAGE ECONOMICS</text>
  <text x="860" y="268" class="panel-title">Ownership changes the outcome</text>

  <rect x="860" y="294" width="640" height="142" rx="18" fill="#071d26" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="884" y="324" fill="#5eead4" font-size="15" font-weight="850" letter-spacing="1.4">GALLERY / PROVIDER SOURCE</text>
  <rect x="884" y="339" width="166" height="66" rx="14" fill="#0f172a" stroke="#64748b"/>
  <text x="901" y="366" fill="#f8fafc" font-size="19" font-weight="800">gallery source</text>
  <text x="901" y="391" fill="#cbd5e1" font-size="16">remains</text>
  <text x="1068" y="382" fill="#94a3b8" font-size="28" font-weight="800">+</text>
  <rect x="1104" y="339" width="180" height="66" rx="14" fill="#0f766e" stroke="#5eead4"/>
  <text x="1122" y="366" fill="#f8fafc" font-size="19" font-weight="800">owned output</text>
  <text x="1122" y="391" fill="#ccfbf1" font-size="16">transient</text>
  <line x1="1298" y1="372" x2="1338" y2="372" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1352" y="339" width="124" height="66" rx="14" fill="#ccfbf1"/>
  <text x="1367" y="366" fill="#134e4a" font-size="18" font-weight="850">remove only</text>
  <text x="1371" y="391" fill="#134e4a" font-size="16">the output</text>
  <text x="884" y="426" fill="#cbd5e1" font-size="15">Peak device storage can rise while source and output coexist.</text>

  <rect x="860" y="452" width="640" height="174" rx="18" fill="#071d26" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="884" y="482" fill="#5eead4" font-size="15" font-weight="850" letter-spacing="1.4">APP-OWNED STAGING</text>
  <rect x="884" y="497" width="214" height="62" rx="14" fill="#0f172a" stroke="#64748b"/>
  <text x="903" y="524" fill="#f8fafc" font-size="19" font-weight="800">200 × 4 MB staging</text>
  <text x="903" y="548" fill="#cbd5e1" font-size="15">800 MB app-owned</text>
  <line x1="1110" y1="528" x2="1145" y2="528" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1159" y="497" width="290" height="62" rx="14" fill="#0f766e" stroke="#5eead4"/>
  <text x="1178" y="524" fill="#f8fafc" font-size="19" font-weight="800">200 × 0.5 MB accepted</text>
  <text x="1178" y="548" fill="#ccfbf1" font-size="15">100 MB after replacement</text>
  <text x="884" y="592" fill="#f8fafc" font-size="25" font-weight="850">700 MB lower app-owned queue footprint</text>
  <text x="884" y="617" fill="#cbd5e1" font-size="15">Only when the app may replace or delete its staging files.</text>

  <rect x="60" y="706" width="1480" height="76" rx="20" fill="#fef3c7"/>
  <text x="92" y="742" fill="#92400e" font-size="22" font-weight="850">BOUNDARY</text>
  <text x="240" y="742" fill="#78350f" font-size="22" font-weight="700">Gallery sources stay; staging falls only when the app may replace or delete it.</text>
  <text x="240" y="769" fill="#92400e" font-size="17">Examples are arithmetic, not incremental savings; compare accepted uploads with a matched baseline.</text>
</svg>
