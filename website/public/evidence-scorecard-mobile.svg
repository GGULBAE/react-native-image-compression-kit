<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title description">
  <title id="title">React Native Image Compression Kit v0.4.0 evidence snapshot</title>
  <desc id="description">One of two native captures passes the combined byte-budget and visual-integrity gate because the retained v0.4.0 iOS capture is orientation-affected. Other safety, metadata, capability, and build signals remain separately reported.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151d" />
      <stop offset="0.54" stop-color="#0a1b25" />
      <stop offset="1" stop-color="#0b172c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #5eead4; font-size: 15px; font-weight: 700; letter-spacing: 2.2px; }
      .headline { fill: #f8fafc; font-size: 34px; font-weight: 750; }
      .subtitle { fill: #94a3b8; font-size: 16px; font-weight: 400; }
      .card { fill: #102632; stroke: #244354; stroke-width: 1; }
      .card-label { fill: #99f6e4; font-size: 12px; font-weight: 700; letter-spacing: 1.15px; }
      .card-value { fill: #f8fafc; font-size: 48px; font-weight: 760; }
      .card-copy { fill: #cbd5e1; font-size: 15px; font-weight: 500; }
      .guardrail { fill: #0d2230; stroke: #1e3a4b; stroke-width: 1; }
      .guardrail-value { fill: #f8fafc; font-size: 26px; font-weight: 740; }
      .guardrail-copy { fill: #9fb1c2; font-size: 14px; font-weight: 500; }
      .footer { fill: #7f96aa; font-size: 12px; font-weight: 500; }
    </style>
  </defs>

  <rect width="720" height="940" rx="28" fill="url(#background)" />
  <circle cx="670" cy="-20" r="190" fill="#2563eb" opacity="0.09" />
  <circle cx="35" cy="970" r="230" fill="#14b8a6" opacity="0.08" />
  <rect x="40" y="46" width="38" height="4" rx="2" fill="url(#accent)" />
  <text x="92" y="56" class="eyebrow">PRODUCT EVIDENCE · v0.4.0</text>
  <text x="40" y="105" class="headline">Predictability,</text>
  <text x="40" y="147" class="headline">measured as a contract</text>
  <text x="40" y="181" class="subtitle">Versioned fixtures and release evidence —</text>
  <text x="40" y="204" class="subtitle">not universal performance claims.</text>

  <rect x="40" y="236" width="310" height="176" rx="18" class="card" />
  <rect x="370" y="236" width="310" height="176" rx="18" class="card" />
  <text x="64" y="270" class="card-label">BYTE + VISUAL</text>
  <text x="64" y="289" class="card-label">INTEGRITY</text>
  <text x="64" y="348" class="card-value">1 / 2</text>
  <text x="64" y="384" class="card-copy">iOS capture affected</text>
  <rect x="64" y="397" width="108" height="4" rx="2" fill="url(#accent)" />
  <text x="394" y="270" class="card-label">FAILURE-SAFE</text>
  <text x="394" y="289" class="card-label">COMPLETION</text>
  <text x="394" y="348" class="card-value">0</text>
  <text x="394" y="384" class="card-copy">residual-output target</text>
  <rect x="394" y="397" width="108" height="4" rx="2" fill="url(#accent)" />

  <rect x="40" y="432" width="640" height="150" rx="18" class="card" />
  <text x="64" y="468" class="card-label">RUNTIME CAPABILITY SIGNAL</text>
  <text x="64" y="530" class="card-value">2</text>
  <text x="134" y="525" class="card-copy">recorded runtimes</text>
  <text x="134" y="548" class="card-copy">captured before work</text>
  <rect x="64" y="565" width="108" height="4" rx="2" fill="url(#accent)" />

  <rect x="40" y="602" width="640" height="82" rx="16" class="guardrail" />
  <rect x="40" y="700" width="640" height="82" rx="16" class="guardrail" />
  <rect x="40" y="798" width="640" height="82" rx="16" class="guardrail" />
  <text x="64" y="652" class="guardrail-value">96%</text>
  <text x="158" y="649" class="guardrail-copy">fewer planned decoded pixels</text>
  <text x="64" y="750" class="guardrail-value">0 / 7</text>
  <text x="158" y="747" class="guardrail-copy">named sensitive fields retained</text>
  <text x="64" y="848" class="guardrail-value">8 / 8</text>
  <text x="158" y="845" class="guardrail-copy">packed-consumer platform builds</text>

  <text x="40" y="910" class="footer">v0.4.0 snapshot · iOS defect disclosed · 0.4.1 candidate fixes and gates capture</text>
</svg>
