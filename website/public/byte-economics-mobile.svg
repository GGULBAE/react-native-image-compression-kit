<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1220" viewBox="0 0 760 1220" role="img" aria-labelledby="title desc">
  <title id="title">Device-side image byte economics</title>
  <desc id="desc">A mobile layout showing upload bytes that move and app-owned storage bytes that remain, with illustrative arithmetic and a source-file boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151d"/>
      <stop offset="1" stop-color="#0b1f2b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; }
      .title { font-size: 34px; font-weight: 850; fill: #f8fafc; }
      .box-title { font-size: 20px; font-weight: 800; }
      .box-note { font-size: 15px; }
    </style>
  </defs>
  <rect width="760" height="1220" rx="28" fill="url(#background)"/>
  <text x="42" y="66" fill="#f8fafc" font-size="38" font-weight="850">Control bytes before cost</text>
  <text x="42" y="106" fill="#94a3b8" font-size="19">Moving bytes + app-owned bytes at rest</text>

  <rect x="32" y="145" width="696" height="405" rx="24" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="64" y="190" class="label" fill="#60a5fa">01 · UPLOAD ECONOMICS</text>
  <text x="64" y="232" class="title">Bytes that move</text>
  <rect x="64" y="275" width="155" height="94" rx="16" fill="#0f172a" stroke="#64748b"/>
  <text x="84" y="316" class="box-title" fill="#f8fafc">4 MB source</text>
  <text x="84" y="344" class="box-note" fill="#cbd5e1">local</text>
  <line x1="229" y1="322" x2="263" y2="322" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="278" y="275" width="205" height="94" rx="16" fill="#2563eb" stroke="#60a5fa"/>
  <text x="298" y="316" class="box-title" fill="#f8fafc">500 KB output</text>
  <text x="298" y="344" class="box-note" fill="#dbeafe">accepted</text>
  <line x1="493" y1="322" x2="527" y2="322" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="542" y="275" width="130" height="94" rx="16" fill="#f8fafc"/>
  <text x="566" y="331" class="box-title" fill="#0f172a">upload</text>
  <text x="64" y="424" fill="#93c5fd" font-size="21" font-weight="750">avoided bytes = source − accepted output</text>
  <text x="64" y="466" fill="#e2e8f0" font-size="18">Illustrative: 1M images · 4 MB → 500 KB</text>
  <text x="64" y="506" fill="#f8fafc" font-size="27" font-weight="850">≈ 3.5 TB fewer first-hop bytes</text>

  <rect x="32" y="580" width="696" height="460" rx="24" fill="#083344" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text x="64" y="625" class="label" fill="#5eead4">02 · DEVICE STORAGE ECONOMICS</text>
  <text x="64" y="667" class="title">App-owned bytes at rest</text>
  <rect x="64" y="710" width="132" height="92" rx="15" fill="#0f172a" stroke="#64748b"/>
  <text x="82" y="749" class="box-title" fill="#f8fafc">source</text>
  <text x="82" y="776" class="box-note" fill="#cbd5e1">unchanged</text>
  <line x1="206" y1="756" x2="230" y2="756" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="245" y="710" width="170" height="92" rx="15" fill="#0f766e" stroke="#5eead4"/>
  <text x="263" y="749" class="box-title" fill="#f8fafc">verified output</text>
  <text x="263" y="776" class="box-note" fill="#ccfbf1">package-owned</text>
  <line x1="425" y1="756" x2="449" y2="756" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="464" y="710" width="103" height="92" rx="15" fill="#f8fafc"/>
  <text x="480" y="763" class="box-title" fill="#0f172a">upload</text>
  <line x1="577" y1="756" x2="601" y2="756" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="616" y="710" width="80" height="92" rx="15" fill="#ccfbf1"/>
  <text x="626" y="750" fill="#134e4a" font-size="17" font-weight="850">remove</text>
  <text x="630" y="776" fill="#134e4a" font-size="15">owned</text>
  <text x="64" y="860" fill="#5eead4" font-size="20" font-weight="750">footprint = queue + outputs + cache + residual</text>
  <text x="64" y="902" fill="#e2e8f0" font-size="18">Illustrative: 200 app-owned staged images</text>
  <text x="64" y="942" fill="#f8fafc" font-size="27" font-weight="850">800 MB → 100 MB</text>
  <text x="64" y="980" fill="#99f6e4" font-size="21" font-weight="750">700 MB difference</text>

  <rect x="32" y="1070" width="696" height="112" rx="20" fill="#fef3c7"/>
  <text x="58" y="1108" fill="#92400e" font-size="20" font-weight="850">BOUNDARY · gallery sources are not deleted</text>
  <text x="58" y="1140" fill="#78350f" font-size="17">Transient source + output storage may increase.</text>
  <text x="58" y="1168" fill="#92400e" font-size="15">Illustrative arithmetic, not measured performance.</text>
</svg>
