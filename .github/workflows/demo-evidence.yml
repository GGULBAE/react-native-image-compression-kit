name: Native Demo Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/demo-evidence.yml"
      - "android/**"
      - "example/**"
      - "benchmarks/native-comparison/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "scripts/capture-android-demo.sh"
      - "scripts/benchmark-core.mjs"
      - "scripts/benchmark-comparison-core.mjs"
      - "scripts/create-benchmark-comparison-evidence.mjs"
      - "scripts/create-benchmark-evidence.mjs"
      - "scripts/create-demo-evidence.mjs"
      - "scripts/demo-evidence-core.mjs"
      - "scripts/guided-demo-core.mjs"
      - "scripts/normalize-demo-recording.mjs"
      - "scripts/verify-benchmark-comparison-evidence.mjs"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit to capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-demo-evidence-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Android native demo capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses >/dev/null

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install recording tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Resolve package version
        id: package
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      - name: Capture Android result
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          RNICK_DEMO_PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RNICK_DEMO_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          RNICK_DEMO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash scripts/capture-android-demo.sh

      - name: Upload Android evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-demo-android-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: demo-evidence/android
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS native demo capture
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install recording tools
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version | head -n 1

      - name: Resolve package version
        id: package
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      - name: Build example app
        run: |
          pnpm build
          pnpm example:ios:build

      - name: Capture iOS result
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices booted --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=Object.values(JSON.parse(s).devices).flat()[0];if(!d)process.exit(1);process.stdout.write(d.udid)})")
          app=example/ios/build/Build/Products/Debug-iphonesimulator/ImageCompressionKitExample.app
          xcrun simctl install "$udid" "$app"
          pnpm --filter image-compression-kit-example exec react-native start --port 8081 > /tmp/rnick-metro.log 2>&1 &
          metro_pid=$!
          video_pid=""
          cleanup() {
            if [ -n "$video_pid" ]; then
              kill -INT "$video_pid" 2>/dev/null || true
              wait "$video_pid" 2>/dev/null || true
            fi
            kill "$metro_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running' && break
            test "$attempt" != "60"
            sleep 1
          done
          SIMCTL_CHILD_RNICK_DEMO_CAPTURE=1 xcrun simctl launch --terminate-running-process "$udid" com.imagecompressionkit.example --rnick-demo-capture
          mkdir -p /tmp/rnick-demo-raw
          capture_native_log() {
            xcrun simctl spawn "$udid" log show --style compact --last 3m --predicate 'eventMessage CONTAINS "RNICK_DEMO_" OR eventMessage CONTAINS "RNICK_GUIDED_DEMO_" OR eventMessage CONTAINS "RNICK_BENCHMARK_"' > /tmp/rnick-demo-raw/native.log
          }
          for attempt in $(seq 1 60); do
            capture_native_log
            if grep -q 'RNICK_GUIDED_DEMO_READY' /tmp/rnick-demo-raw/native.log; then
              break
            fi
            test "$attempt" != "60"
            sleep 1
          done
          xcrun simctl io "$udid" recordVideo --codec=h264 --force /tmp/rnick-demo-raw/recording-raw.mp4 > /tmp/rnick-demo-raw/record-video.log 2>&1 &
          video_pid=$!
          for attempt in $(seq 1 60); do
            capture_native_log
            if grep -q 'RNICK_GUIDED_DEMO_PASS' /tmp/rnick-demo-raw/native.log; then
              break
            fi
            test "$attempt" != "60"
            sleep 1
          done
          sleep 2
          kill -INT "$video_pid"
          wait "$video_pid" || true
          video_pid=""
          for attempt in $(seq 1 120); do
            capture_native_log
            if grep -q 'RNICK_DEMO_PASS' /tmp/rnick-demo-raw/native.log && \
              grep -q 'RNICK_BENCHMARK_PASS' /tmp/rnick-demo-raw/native.log && \
              grep -q 'RNICK_BENCHMARK_COMPARISON_PASS' /tmp/rnick-demo-raw/native.log; then
              break
            fi
            test "$attempt" != "120"
            sleep 1
          done
          sleep 2
          xcrun simctl io "$udid" screenshot /tmp/rnick-demo-raw/screen.png
          node --input-type=module - /tmp/rnick-demo-raw/native.log > /tmp/rnick-demo-raw/uris.txt <<'NODE'
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8');
          const match = [...text.matchAll(/RNICK_DEMO_PASS (\{.+\})/g)].at(-1);
          if (!match) throw new Error('native demo marker missing');
          const value = JSON.parse(match[1]);
          console.log(new URL(value.sourceUri).pathname);
          console.log(new URL(value.result.uri).pathname);
          NODE
          cp "$(sed -n '1p' /tmp/rnick-demo-raw/uris.txt)" /tmp/rnick-demo-raw/source.jpg
          cp "$(sed -n '2p' /tmp/rnick-demo-raw/uris.txt)" /tmp/rnick-demo-raw/output.jpg
          runtime=$(xcrun simctl list devices booted --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const e=Object.entries(p.devices).find(([,v])=>v.length);process.stdout.write(e[0].replace('com.apple.CoreSimulator.SimRuntime.','').replaceAll('-','.'))})")
          device=$(xcrun simctl list devices booted --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=Object.values(JSON.parse(s).devices).flat()[0];process.stdout.write(d.name)})")
          node scripts/normalize-demo-recording.mjs \
            --input /tmp/rnick-demo-raw/recording-raw.mp4 \
            --output /tmp/rnick-demo-raw/recording.mp4 \
            --log /tmp/rnick-demo-raw/native.log \
            --result-frame /tmp/rnick-demo-raw/screen.png
          node scripts/create-demo-evidence.mjs \
            --platform ios \
            --package-version "${{ steps.package.outputs.version }}" \
            --source-sha "${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}" \
            --runtime "$runtime" \
            --device "$device" \
            --source /tmp/rnick-demo-raw/source.jpg \
            --output /tmp/rnick-demo-raw/output.jpg \
            --screenshot /tmp/rnick-demo-raw/screen.png \
            --recording /tmp/rnick-demo-raw/recording.mp4 \
            --capture-method "ios simctl recordVideo H.264; timeline normalized and final native frame held with ffmpeg" \
            --log /tmp/rnick-demo-raw/native.log \
            --destination demo-evidence/ios \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/create-benchmark-evidence.mjs \
            --platform ios \
            --package-version "${{ steps.package.outputs.version }}" \
            --source-sha "${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}" \
            --runtime "$runtime" \
            --device "$device" \
            --source /tmp/rnick-demo-raw/source.jpg \
            --log /tmp/rnick-demo-raw/native.log \
            --destination demo-evidence/ios \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/create-benchmark-comparison-evidence.mjs \
            --platform ios \
            --source-sha "${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}" \
            --runtime "$runtime" \
            --device "$device" \
            --source /tmp/rnick-demo-raw/source.jpg \
            --log /tmp/rnick-demo-raw/native.log \
            --plan benchmarks/native-comparison/implementations.json \
            --destination demo-evidence/ios \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/verify-benchmark-comparison-evidence.mjs demo-evidence/ios

      - name: Upload iOS evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-demo-ios-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: demo-evidence/ios
          if-no-files-found: error
          retention-days: 30
